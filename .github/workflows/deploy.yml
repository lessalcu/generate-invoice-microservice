name: Deploy to AWS

on:
  push:
    branches:
      - test  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v2

      - name: Login en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Construir y subir imagen a Docker Hub
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/generate-invoice_microservice_image:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/generate-invoice_microservice_image:latest

      - name: Conectar a AWS EC2 y desplegar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Iniciando despliegue en AWS EC2..."

            # Detener y eliminar el contenedor si ya existe
            if sudo docker ps -a --format '{{.Names}}' | grep -q lssalas_generate_invoice_microservice_container; then
              echo "🛑 Deteniendo y eliminando contenedor existente..."
              sudo docker stop lssalas_generate_invoice_microservice_container
              sudo docker rm lssalas_generate_invoice_microservice_container
            fi

            # Remover imágenes antiguas para evitar acumulación
            echo "🧹 Limpiando imágenes antiguas..."
            sudo docker image prune -af || true

            # Descargar la última versión de la imagen desde Docker Hub
            echo "📥 Descargando nueva imagen..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/generate-invoice_microservice_image:latest

            # Ejecutar el nuevo contenedor con las variables de entorno
            echo "🚀 Ejecutando nuevo contenedor..."
            sudo docker run -d --name lssalas_generate_invoice_microservice_container \
              --env MONGO_DB=${{ secrets.MONGO_DB }} \
              --env MONGO_COLLECTION=${{ secrets.MONGO_COLLECTION }} \
              --env MONGO_URI=${{ secrets.MONGO_URI }} \
              --env USERS_MICROSERVICE_URL=${{ secrets.USERS_MICROSERVICE_URL }} \
              --env RESERVATIONS_MICROSERVICE_URL=${{ secrets.RESERVATIONS_MICROSERVICE_URL }} \
              -p 5005:5005 \
              ${{ secrets.DOCKER_USERNAME }}/generate-invoice_microservice_image:latest

            echo "✅ Despliegue completado con éxito."
