name: Docker Image CI

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

env:
  IMAGE_NAME: lssalas/generate_invoice_microservice_image
  CONTAINER_NAME: lssalas_generate_invoice_microservice_container
  PORT: 5005
  
jobs:

  build:

    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy_to_ec2:
    name: Deploy Updated Docker Container to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Update and Restart Docker Container
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            docker pull --quiet ${{ env.IMAGE_NAME }}:latest
            
            # Verifica si el contenedor ya está corriendo y lo actualiza sin eliminarlo
            if [ "$(docker ps -q -f name=${{ env.CONTAINER_NAME }})" ]; then
              echo "Container already running, updating..."
              docker stop ${{ env.CONTAINER_NAME }}
              docker rm ${{ env.CONTAINER_NAME }}
            fi

            # Elimina imágenes antiguas para liberar espacio
            docker image prune -f

            # Inicia el contenedor con las variables de entorno desde GitHub Secrets
            docker run -d -p ${{ env.PORT }}:${{ env.PORT }} \
              --name ${{ env.CONTAINER_NAME }} \
              -e MONGO_DB=${{ secrets.MONGO_DB }} \
              -e MONGO_COLLECTION=${{ secrets.MONGO_COLLECTION }} \
              -e MONGO_URI=${{ secrets.MONGO_URI }} \
              -e USERS_MICROSERVICE_URL=${{ secrets.USERS_MICROSERVICE_URL }} \
              -e RESERVATIONS_MICROSERVICE_URL=${{ secrets.RESERVATIONS_MICROSERVICE_URL }} \
              ${{ env.IMAGE_NAME }}:latest
